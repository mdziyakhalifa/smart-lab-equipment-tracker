
services:
  # FastAPI Backend
  - type: web
    name: smart-lab-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SLT_SECRET_KEY
        generateValue: true
      - key: SLT_DATABASE_URL
        value: sqlite:///./lab_tracker.db
      - key: SLT_SEED
        value: "false"
      - key: SLT_SCHEDULER
        value: "false"

  # React Frontend
  - type: web
    name: smart-lab-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
